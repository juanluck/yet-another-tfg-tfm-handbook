# book/_quarto.yml
project:
  type: book
  # Hacemos que el libro se genere dentro de la web existente
  output-dir: ../_site/book

lang: es

book:
  title: "Yet Another TFG/TFM Handbook"
  author: "Juan Luis Jiménez Laredo"      # cámbialo por tu nombre
  date: "2025"
  # Opcional: subtítulo, portada, etc.
  subtitle: "Guía de trabajo para proyectos TFG/TFM en la ETSIIT - UGR"
  # cover-image: cover.png       # si algún día quieres una imagen de portada
  output-file: "handbook-tfg-tfm-etsiit-ugr"


  chapters:
    - index.qmd
    - ../docs/metodologia-agil.qmd
    - ../docs/github-organizacion.qmd
    - ../docs/memoria-tfg-tfm.qmd

format:
  pdf:
    documentclass: scrbook   # aspecto de libro
    papersize: a4
    geometry:
      - top=25mm
      - bottom=25mm
      - inner=30mm
      - outer=20mm
    toc: true
    toc-title: "Índice"
    number-sections: true
    include-in-header: header.tex
    include-before-body:
      text: |
        %%% Override de colores de callout para que el fondo sea blanco
        % Note
        \definecolor{quarto-callout-note-color}{HTML}{FFFFFF}
        \definecolor{quarto-callout-note-color-frame}{HTML}{000000}
        % Warning
        \definecolor{quarto-callout-warning-color}{HTML}{FFFFFF}
        \definecolor{quarto-callout-warning-color-frame}{HTML}{000000}
        % Important
        \definecolor{quarto-callout-important-color}{HTML}{FFFFFF}
        \definecolor{quarto-callout-important-color-frame}{HTML}{000000}
        % Tip
        \definecolor{quarto-callout-tip-color}{HTML}{FFFFFF}
        \definecolor{quarto-callout-tip-color-frame}{HTML}{000000}
        % Caution
        \definecolor{quarto-callout-caution-color}{HTML}{FFFFFF}
        \definecolor{quarto-callout-caution-color-frame}{HTML}{000000}